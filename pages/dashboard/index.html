/* ── lightweight markdown (escaped first, so no raw HTML can survive) ── */
function mdInline(s) {
  return esc(s)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<em>$2</em>")
    .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

/* Fenced code blocks are extracted first so their contents are never
   interpreted as markdown. */
function md(src) {
  var text = String(src == null ? "" : src);
  var blocks = [];
  text = text.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, function (_m, lang, body) {
    blocks.push(
      '<pre><code data-lang="' + esc(lang || "") + '">' + esc(body.replace(/\n$/, "")) +
      "</code></pre>"
    );
    return "␀" + (blocks.length - 1) + "␀";
  });

  var out = [];
  var lines = text.split("\n");
  var list = null;   // "ul" | "ol" | null

  function closeList() {
    if (list) { out.push("</" + list + ">"); list = null; }
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var fence = line.match(/^␀(\d+)␀$/);
    if (fence) { closeList(); out.push(blocks[+fence[1]]); continue; }
    if (!line.trim()) { closeList(); continue; }

    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      closeList();
      var lvl = Math.min(6, h[1].length + 2);
      out.push("<p><strong>" + mdInline(h[2]) + "</strong></p>");
      void lvl;
      continue;
    }
    var ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if (ul) {
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push("<li>" + mdInline(ul[1]) + "</li>");
      continue;
    }
    var ol = line.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if (ol) {
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push("<li>" + mdInline(ol[2]) + "</li>");
      continue;
    }
    var q = line.match(/^>\s?(.*)$/);
    if (q) {
      closeList();
      out.push('<blockquote style="margin:4px 0;padding-left:9px;border-left:2px solid var(--border-strong);color:var(--text-muted)">' +
        mdInline(q[1]) + "</blockquote>");
      continue;
    }
    closeList();
    out.push("<p>" + mdInline(line) + "</p>");
  }
  closeList();
  return out.join("");
}

/* ── chat view ──────────────────────────────────────────────────────── */
var view = "dash";

function setView(next) {
  view = next;
  $("view-dash").hidden = next !== "dash";
  $("view-chat").hidden = next !== "chat";
  $("tab-dash").setAttribute("aria-selected", String(next === "dash"));
  $("tab-chat").setAttribute("aria-selected", String(next === "chat"));
  if (next === "chat") {
    autoSelectChatAgent();
    renderChat();
    scrollThread(true);
  }
}

$("tab-dash").addEventListener("click", function () { setView("dash"); });
$("tab-chat").addEventListener("click", function () { setView("chat"); });

function autoSelectChatAgent() {
  if (state.selectedId && state.byId[state.selectedId]) return;
  var list = visibleAgents();
  if (!list.length) return;
  // prefer something live, else the most recent
  var pick = null;
  for (var i = list.length - 1; i >= 0; i--) {
    if (list[i].status === "running" || list[i].status === "queued") { pick = list[i]; break; }
  }
  if (!pick) pick = list[list.length - 1];
  state.selectedId = pick.id;
  state.turns = [];
  state.turnsFor = null;
}

function renderChatList() {
  var list = visibleAgents().slice().reverse();
  var html = list.map(function (a) {
    var sel = a.id === state.selectedId;
    return '<button class="citem" role="option" aria-current="' + sel + '" data-id="' + esc(a.id) + '">' +
      '<span class="tw-dot ' + esc(a.status) + '" style="margin-top:5px"></span>' +
      '<span class="citem-main">' +
        '<span class="citem-top">' +
          '<span class="citem-name">' + esc(a.name || "?") + "</span>" +
          (a.status !== "completed"
            ? '<span class="citem-badge" style="color:var(--' +
              (a.status === "running" ? "accent" : a.status === "failed" ? "danger" : "text-muted") +
              ')">' + esc(t(a.status)) + "</span>"
            : "") +
        "</span>" +
        '<span class="citem-goal">' + esc(a.goal || "") + "</span>" +
        '<span class="citem-meta">' + esc(fmtDuration(a.duration_seconds)) +
          (a.tool_count ? " · " + esc(t("tools")) + " " + a.tool_count : "") + "</span>" +
      "</span></button>";
  }).join("");
  el.chatList.innerHTML = html ||
    '<div class="conv-empty">' + esc(emptyStateText()) + "</div>";
  el.chatCount.textContent = list.length ? list.length : "";
}

function emptyStateText() {
  if (state.fetchError) return t("fetchFailed");
  return t("noData");
}

function renderChat() {
  if (view !== "chat") return;
  renderChatList();
  renderChatHead();
  renderThread();
}

function renderChatHead() {
  var a = state.byId[state.selectedId];
  var wideBtn = '<button class="btn icon" data-wide="1" aria-pressed="' + !!state.wide +
    '" title="' + esc(t("wideThread")) + '" aria-label="' + esc(t("wideThread")) + '">⇔</button>';
  if (!a) {
    el.chatHead.innerHTML = '<span class="d-goal">' + esc(emptyStateText()) + "</span>" +
      '<span class="chat-head-actions">' + wideBtn + "</span>";
    return;
  }
  el.chatHead.innerHTML =
    '<span class="d-name">' + esc(a.name || "?") + "</span>" +
    '<span class="badge ' + esc(a.status) + '">' + esc(t(a.status)) + "</span>" +
    (a.current_tool
      ? '<span class="tag" style="color:var(--warning);border-color:var(--warning)">' +
        esc(a.current_tool) + "</span>"
      : "") +
    '<span class="d-goal">' + esc(a.goal || "") + "</span>" +
    '<span class="chat-head-actions">' +
      (a.turn_count
        ? '<span class="citem-meta">' + a.turn_count + " " + esc(t("turns")) + "</span>"
        : "") +
      (a.status === "running" || a.status === "queued"
        ? '<button class="btn danger" data-kill="' + esc(a.id) + '">' + esc(t("stop")) + "</button>"
        : "") +
      '<button class="btn icon" data-export="1" title="' + esc(t("export")) +
        '" aria-label="' + esc(t("export")) + '">↓</button>' +
      wideBtn +
    "</span>";
}

function renderThread() {
  var box = el.thread;
  var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
  var a = state.byId[state.selectedId];

  if (!a) {
    el.threadInner.innerHTML =
      '<div class="detail-empty"><span class="big">◍</span>' +
      esc(emptyStateText()) +
      (state.fetchError ? "<br><code>" + esc(state.fetchError) + "</code>" : "") + "</div>";
    el.jump.hidden = true;
    return;
  }
  if (state.turnsFor !== a.id) {
    // The thread is asked for once per agent: selecting in the chat view (or
    // landing there first) has no other path that would fetch the turns.
    if (state.turnsRequestedFor !== a.id) loadTurns(a.id, true);
    el.threadInner.innerHTML = '<div class="conv-empty">◌</div>';
    el.jump.hidden = true;
    return;
  }

  var turns = state.turns;
  var html = "";
  for (var i = 0; i < turns.length; i++) {
    var cur = turns[i], prev = turns[i - 1], next = turns[i + 1];
    // A tool call and its result are two stream events but one thing a reader
    // cares about, so the result card carries the arguments too and the call
    // itself is not drawn separately.
    if (cur.role === "tool_call" && next && next.role === "tool_result") continue;
    // a run divider whenever the agent (re)starts speaking
    if (i === 0 || (prev && prev.role === "tool_result")) {
      html += '<div class="rrun">' + esc(fmtClock(cur.ts)) + " · " +
        esc(a.name || "") + "</div>";
    }
    html += bubbleHTML(cur, prev);
  }
  if (a.status === "running" || a.status === "queued") {
    var last = turns[turns.length - 1];
    if (!last || (last.role !== "assistant" && last.role !== "tool_call")) {
      html += '<div class="msg in"><div class="bubble b-assistant">' +
        '<div class="who">' + esc(t("assistant")) +
        '<span class="typing"><i></i><i></i><i></i></span></div></div></div>';
    }
  }
  el.threadInner.innerHTML = html;
  restoreOpenTools();
  if (state.follow || nearBottom) scrollThread(false);
  el.jump.hidden = !state.follow && !nearBottom;
}

function bubbleHTML(x, prev) {
  var when = '<span class="when">' + esc(fmtClock(x.ts)) + "</span>";
  var tool = x.tool ? '<span class="cv-tool">' + esc(x.tool) + "</span>" : "";

  if (x.role === "tool_call" || x.role === "tool_result") {
    // pair a result with the call above it so the card reads as one action
    var call = x.role === "tool_result" && prev && prev.role === "tool_call" ? prev : null;
    var open = state.openTools[x.seq] ? " open" : "";
    var isErr = !!x.is_error;
    var body = "";
    if (call && call.args && Object.keys(call.args).length) {
      body += '<div class="tool-sec"><div class="tool-sec-label">' + esc(t("args")) +
        '</div><pre>' + esc(JSON.stringify(call.args, null, 2)) + "</pre></div>";
    }
    if (x.role === "tool_result") {
      var txt = x.text || "";
      var long = txt.length > 900;
      body += '<div class="tool-sec"><div class="tool-sec-label">' + esc(t("result")) +
        "</div><pre>" + esc(long ? txt.slice(0, 900) + "\n…" : txt) + "</pre>";
      if (long) {
        body += '<button class="thinking-toggle" data-more="' + x.seq + '">' +
          esc(t("showAll")) + " (" + txt.length + ")</button>";
      }
      body += "</div>";
      if (x.truncated) {
        body += '<div class="tool-more">' + esc(t("truncated")) + "</div>";
      }
    } else {
      body += '<div class="tool-sec"><div class="tool-sec-label">' + esc(t("pending")) +
        "</div></div>";
    }
    return '<div class="msg in"><div class="bubble b-tool">' +
      '<button class="tool-head" data-tool="' + x.seq + '" aria-expanded="' +
        (!!state.openTools[x.seq]) + '">' +
        '<span class="tool-caret">' + (state.openTools[x.seq] ? "▼" : "▶") + "</span>" +
        '<span class="tool-name2">' + esc(x.tool || "?") + "</span>" +
        '<span class="tool-tag' + (isErr ? " err" : "") + '">' +
          esc(x.role === "tool_result" ? t("result") : t("calling")) + "</span>" +
      "</button>" +
      '<div class="tool-body"' + (state.openTools[x.seq] ? "" : " hidden") + ">" + body + "</div>" +
      "</div></div>";
  }

  var out = x.role === "user";
  var label = t(ROLE_KEY[x.role] || "assistant");
  var inner;

  if (x.role === "reasoning") {
    var openR = state.openReasoning[x.seq];
    var rTxt = x.text || "";
    inner =
      '<div class="who">' +
        '<button class="thinking-toggle" data-think="' + x.seq + '" aria-expanded="' + !!openR + '">' +
          (openR ? "▼" : "▶") + " " + esc(t("reasoning")) + " · " + rTxt.length + " " +
          esc(t("chars")) +
        "</button>" + when +
      "</div>" +
      (openR ? '<div style="margin-top:5px">' + md(rTxt) + "</div>" : "");
    return '<div class="msg in"><div class="bubble b-reasoning">' + inner + "</div></div>";
  }

  var cursor = x.streaming ? '<span class="cursor" aria-hidden="true"></span>' : "";
  inner = '<div class="who">' + esc(label) + (tool ? tool : "") + when + "</div>" +
    (x.text ? md(x.text) : "") + cursor;
  if (x.truncated) inner += '<div class="tool-more">' + esc(t("truncated")) + "</div>";

  var cls = "bubble b-" + (out ? "user" : x.role);
  return '<div class="msg ' + (out ? "out" : "in") + '"><div class="' + cls + '">' +
    inner + "</div></div>";
}

function restoreOpenTools() {
  Object.keys(state.openTools).forEach(function (k) {
    if (!state.openTools[k]) return;
    var head = el.threadInner.querySelector('[data-tool="' + k + '"]');
    if (!head) return;
    var body = head.nextElementSibling;
    if (body) body.removeAttribute("hidden");
  });
}

function scrollThread(instant) {
  var box = el.thread;
  if (instant) box.scrollTop = box.scrollHeight;
  else box.scrollTop = box.scrollHeight;
}

el.thread.addEventListener("scroll", function () {
  var box = el.thread;
  var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
  if (nearBottom) state.follow = true;
  else state.follow = false;
  el.jump.hidden = nearBottom || !state.byId[state.selectedId];
});

el.jump.addEventListener("click", function () {
  state.follow = true;
  el.jump.hidden = true;
  scrollThread(true);
});

el.chatList.addEventListener("click", function (e) {
  var item = e.target.closest("[data-id]");
  if (item) selectAgent(item.getAttribute("data-id"));
});

el.chatHead.addEventListener("click", function (e) {
  var kill = e.target.closest("[data-kill]");
  if (kill) {
    var kid = kill.getAttribute("data-kill");
    askConfirm(t("stopConfirm"), function () { killAgent(kid); });
    return;
  }
  if (e.target.closest("[data-wide]")) { toggleWide(); return; }
  if (e.target.closest("[data-export]")) doExport();
});

el.thread.addEventListener("click", function (e) {
  var head = e.target.closest("[data-tool]");
  if (head) {
    var k = head.getAttribute("data-tool");
    state.openTools[k] = !state.openTools[k];
    var body = head.nextElementSibling;
    var open = !!state.openTools[k];
    head.setAttribute("aria-expanded", String(open));
    head.querySelector(".tool-caret").textContent = open ? "▼" : "▶";
    if (body) { if (open) body.removeAttribute("hidden"); else body.setAttribute("hidden", ""); }
    return;
  }
  var more = e.target.closest("[data-more]");
  if (more) {
    var seq = more.getAttribute("data-more");
    state.openTools[seq] = true;
    state.showAll = state.showAll || {};
    state.showAll[seq] = true;
    renderThread();
    return;
  }
  var think = e.target.closest("[data-think]");
  if (think) {
    var rk = think.getAttribute("data-think");
    state.openReasoning[rk] = !state.openReasoning[rk];
    renderThread();
  }
});

function doExport() {
  var b = bridge();
  if (!b || !state.selectedId) return;
  b.download("export", { id: state.selectedId }, state.selectedId + ".json")
    .catch(function () { copyConversation(); });
}

/* ── resizable columns + focus mode ─────────────────────────────────── */
var LAYOUT_KEY = "subagent-viz.layout.v2";
var MIN_TREE = 170;
var MIN_GANTT = 200;

function loadLayout() {
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "null"); } catch (e) { saved = null; }
  state.wTree = saved && saved.tree > MIN_TREE ? saved.tree : 300;
  state.wGantt = saved && saved.gantt > MIN_GANTT ? saved.gantt : 380;
  state.wide = !!(saved && saved.wide);
  state.focus = !!(saved && saved.focus);
  applyLayout();
  syncNarrowLayout();
}

function saveLayout() {
  try {
    localStorage.setItem(LAYOUT_KEY, JSON.stringify({
      tree: state.wTree, gantt: state.wGantt, wide: state.wide, focus: state.focus
    }));
  } catch (e) { /* private mode / quota - the layout just will not persist */ }
}

function applyLayout() {
  var p = el.panels;
  p.style.setProperty("--w-tree", state.wTree + "px");
  p.style.setProperty("--w-gantt", state.wGantt + "px");
  p.classList.toggle("focus-detail", !!state.focus);
  el.btnFocus.setAttribute("aria-pressed", String(!!state.focus));
  el.btnFocus.title = state.focus ? t("exitFocus") : t("focusDetail");
  el.btnFocus.setAttribute("aria-label", el.btnFocus.title);
  $("view-chat").classList.toggle("wide", !!state.wide);
}

/* Below 1100px the detail stacks under the other two, so the vertical split
   between tree and timeline has to become a horizontal one. */
function syncNarrowLayout() {
  var narrow = window.innerWidth <= 1100;
  var stacked = narrow && !state.focus;
  el.panels.classList.toggle("detail-below", stacked);
  var splits = el.panels.querySelectorAll(".vsplit");
  for (var i = 0; i < splits.length; i++) {
    splits[i].style.display = narrow && state.focus ? "none" : "";
  }
  if (stacked) {
    var first = splits[0], second = splits[1];
    if (first) { first.style.display = "none"; }
    if (second) { second.style.cursor = "row-resize"; }
  } else {
    var f2 = splits[0], s2 = splits[1];
    if (f2) f2.style.display = "";
    if (s2) s2.style.cursor = "col-resize";
  }
}

function setFocus(on) {
  state.focus = on === undefined ? !state.focus : !!on;
  applyLayout();
  syncNarrowLayout();
  saveLayout();
}

el.btnFocus.addEventListener("click", function () { setFocus(); });

(function initSplitters() {
  var splits = Array.prototype.slice.call(document.querySelectorAll(".vsplit"));
  splits.forEach(function (handle) {
    var which = handle.getAttribute("data-split") === "0" ? "tree" : "gantt";

    function apply(px) {
      var total = el.panels.clientWidth || 1200;
      var stacked = window.innerWidth <= 1100 && !state.focus;
      var ceiling = which === "tree" ? total * 0.6 : total * 0.7;
      var floor = which === "tree" ? MIN_TREE : MIN_GANTT;
      var v = stacked ? px : Math.max(floor, Math.min(px, ceiling));
      if (which === "tree") state.wTree = stacked ? px : v;
      else state.wGantt = stacked ? px : v;
      if (which === "gantt" && stacked) {
        // the horizontal split positions the detail row, not the gantt width
        el.panels.style.gridTemplateRows =
          "minmax(120px, " + Math.max(120, px) + "px) 5px minmax(200px, 1fr)";
      }
      applyLayout();
    }

    function current() {
      return which === "tree" ? state.wTree : state.wGantt;
    }

    handle.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      e.preventDefault();
      try { handle.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
      handle.classList.add("dragging");
      el.panels.classList.add("resizing");

      function move(ev) {
        var r = el.panels.getBoundingClientRect();
        var stacked = window.innerWidth <= 1100 && !state.focus;
        apply(stacked ? ev.clientY - r.top : ev.clientX - r.left);
      }
      function up() {
        handle.classList.remove("dragging");
        el.panels.classList.remove("resizing");
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        handle.removeEventListener("pointercancel", up);
        if (which === "gantt") el.panels.style.gridTemplateRows = "";
        saveLayout();
      }
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
      handle.addEventListener("pointercancel", up);
    });

    handle.addEventListener("keydown", function (e) {
      var step = e.shiftKey ? 48 : 16;
      var cur = current();
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { apply(cur - step); e.preventDefault(); }
      else if (e.key === "ArrowRight" || e.key === "ArrowDown") { apply(cur + step); e.preventDefault(); }
      else if (e.key === "Home") { apply(which === "tree" ? MIN_TREE : MIN_GANTT); e.preventDefault(); }
      else return;
      saveLayout();
    });

    handle.addEventListener("dblclick", function () {
      state.wTree = 300;
      state.wGantt = 380;
      el.panels.style.gridTemplateRows = "";
      applyLayout();
      saveLayout();
    });
  });
})();

function toggleWide() {
  state.wide = !state.wide;
  $("view-chat").classList.toggle("wide", state.wide);
  saveLayout();
  renderChatHead();
}

window.addEventListener("resize", function () {
  syncNarrowLayout();
  if (view === "chat") tickGantt();
});

/* shortcuts, ignored while typing */
document.addEventListener("keydown", function (e) {
  var tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape" && state.focus) { setFocus(false); e.preventDefault(); return; }
  var k = e.key.toLowerCase();
  if (k === "f" && view === "dash") { setFocus(); e.preventDefault(); }
  else if (k === "w" && view === "chat") { toggleWide(); e.preventDefault(); }
});

/* Runs on every render so a locale change is picked up without a reload. */
function applyStaticI18n() {
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
  }
  el.q.placeholder = t("search");
  el.btnExport.title = t("export");
  el.btnExport.setAttribute("aria-label", t("export"));
  el.btnPause.title = state.paused ? t("paused") : t("live");
  el.btnFocus.title = state.focus ? t("exitFocus") : t("focusDetail");
  el.btnFocus.setAttribute("aria-label", el.btnFocus.title);
}

function applyI18n() {
  applyStaticI18n();
  render();
}

/* ── init ──────────────────────────────────────────────────────────── */
/* The dashboard injects its bridge script before the first closing body tag,
   which is after this inline script runs - so wait for the bridge to appear
   instead of assuming it is already there. */
function waitForBridge(timeoutMs) {
  return new Promise(function (resolve) {
    var deadline = Date.now() + timeoutMs;
    (function poll() {
      if (window.AstrBotPluginPage) return resolve(window.AstrBotPluginPage);
      if (Date.now() >= deadline) return resolve(null);
      setTimeout(poll, 25);
    })();
  });
}

async function init() {
  var sdk = await waitForBridge(8000);
  if (!sdk) {
    el.conn.className = "conn error";
    el.connText.textContent = t("error");
    el.tree.innerHTML =
      '<div class="detail-empty"><span class="big">⚠</span>' +
      "AstrBot dashboard bridge not found.<br>" +
      "Open this page from the AstrBot dashboard plugin page." +
      "</div>";
    return;
  }
  applyI18n();

  // The bridge resolves ready() with the dashboard context, which also carries
  // the light/dark flag. Never block the first fetch on it.
  await Promise.race([
    sdk.ready().catch(function () { return null; }),
    new Promise(function (r) { setTimeout(r, 2500); })
  ]);
  if (sdk.onContext) {
    sdk.onContext(function (c) {
      if (c && typeof c.isDark === "boolean") {
        document.documentElement.setAttribute("data-theme", c.isDark ? "dark" : "light");
      }
  applyI18n();
  loadLayout();

    });
  }

  await fetchSnapshot();
  setConn("live", t("live"));
  loop();

  clearInterval(tickTimer);
  tickTimer = setInterval(tickGantt, 1000);
}

init();

})();
</script>
